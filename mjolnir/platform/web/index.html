<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mjolnir</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; }
    #console { position: fixed; left: 0; bottom: 0; max-height: 30%; margin: 0; overflow: auto; color: #ccc; font: 12px monospace; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #ccc; font: 14px sans-serif; pointer-events: none; }
    .embedded #console, .embedded #status { display: none; } /* the docs page shows these itself */
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="return false"></canvas>
  <div id="status">Loading…</div>
  <pre id="console"></pre>
  <script src="odin.js"></script>
  <script src="wgpu.js"></script>
  <script>
    // The page that embeds this one (docs/site/examples.html) hears {type: 'mjolnir', state} with
    // state 'progress' (loaded, total bytes; total 0 when unknown), 'ready' or 'error'.
    const embedded = window.parent !== window;
    if (embedded) document.documentElement.classList.add("embedded");
    const example = new URLSearchParams(location.search).get("example") || "cube";
    const consoleElement = document.getElementById("console");
    const statusElement = document.getElementById("status");
    const tell = (state, extra) => { if (embedded) window.parent.postMessage({ type: "mjolnir", state, ...extra }, "*"); };
    let failed = false;
    const fail = (message) => {
      if (failed) return;
      failed = true;
      statusElement.textContent = message;
      statusElement.style.display = "";
      consoleElement.textContent += message + "\n";
      tell("error", { message });
    };
    // a trap (panic, failed assert) in a frame is thrown from the animation frame callback
    window.addEventListener("error", (e) => fail(String(e.error ?? e.message)));

    // Downloads the .wasm, reporting progress; runWasm then reads it back from memory.
    async function download(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url}: ${response.status} ${response.statusText}`);
      // Content-Length is the compressed size when the server compresses, so it only bounds progress
      const total = Number(response.headers.get("Content-Length")) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let loaded = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        statusElement.textContent = total ? `Loading… ${Math.min(100, Math.round(loaded / total * 100))}%` : `Loading… ${(loaded / 1e6).toFixed(1)} MB`;
        tell("progress", { loaded, total });
      }
      return URL.createObjectURL(new Blob(chunks, { type: "application/wasm" }));
    }

    if (!navigator.gpu) {
      fail("This browser has no WebGPU.");
    } else {
      // what the engine calls (platform.ready, platform.fail; its log has the details)
      const page = {
        ready: () => { statusElement.style.display = "none"; tell("ready"); },
        fail: () => fail("Stopped on an error, see the log."),
      };
      download(`${example}.wasm`).then((url) => {
        statusElement.textContent = "Starting…";
        const mem = new odin.WasmMemoryInterface();
        const wgpu = new odin.WebGPUInterface(mem);
        return odin.runWasm(url, consoleElement, { wgpu: wgpu.getInterface(), mjolnir: page }, mem);
      }).catch((e) => fail(String(e)));
    }
  </script>
</body>
</html>
