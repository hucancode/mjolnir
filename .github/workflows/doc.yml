name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mjolnir/**'
      - 'examples/**'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # wasm-ld links the live WebGPU builds of the examples
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build Odin vendor libraries
        run: |
          bash /home/runner/odin/vendor/stb/src/build_stb.sh
          bash /home/runner/odin/vendor/cgltf/src/build_cgltf.sh
          bash /home/runner/odin/vendor/box2d/build_box2d.sh
          # build.sh also builds wasm, which may fail on the runner; only the native lib is needed
          bash /home/runner/odin/vendor/box3d/src/build.sh || test -f /home/runner/odin/vendor/box3d/lib/linux-amd64/libbox3d.a

      # libc-shim's strncpy (still in Odin master) is wrong for cgltf on the web: it measures
      # len(src), the whole rest of the unterminated JSON buffer, per token (quadratic: minutes
      # to load an animated glb), and does not zero-pad (strings stay unterminated, every glTF
      # fails as legacy_gltf). Replace its body with a bounded scan plus C zero-padding.
      - name: Patch libc-shim strncpy
        run: |
          python3 - <<'PY'
          import re
          p = "/home/runner/odin/vendor/libc-shim/string.odin"
          s = open(p).read()
          body = (
              "strncpy :: proc \"c\" (dst: [^]byte, src: cstring, count: uint) -> cstring {\n"
              "\ticount := int(count)\n"
              "\tassert_contextless(icount >= 0)\n"
              "\tcnt := 0\n"
              "\tfor cnt < icount && ([^]byte)(src)[cnt] != 0 do cnt += 1\n"
              "\tintrinsics.mem_copy_non_overlapping(dst, rawptr(src), cnt)\n"
              "\tfor i in cnt..<icount do dst[i] = 0\n"
              "\treturn cstring(dst)\n"
              "}\n"
          )
          s, n = re.subn(r"strncpy :: proc \"c\".*?\n}\n", lambda m: body, s, count=1, flags=re.S)
          assert n == 1
          open(p, "w").write(s)
          PY
          grep -q 'cnt < icount' /home/runner/odin/vendor/libc-shim/string.odin

      # render imports both backends, so vendor:wgpu is compiled even for the vulkan build
      - name: Get wgpu-native
        run: |
          curl -fsSL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip
          unzip -q wgpu.zip -d /home/runner/odin/vendor/wgpu/lib/wgpu-linux-x86_64-release
          rm wgpu.zip

      - name: Setup Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build documentation
        run: make doc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
