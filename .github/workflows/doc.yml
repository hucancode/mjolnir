name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mjolnir/**'
      - 'examples/**'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Odin vendor libraries
        run: |
          bash /home/runner/odin/vendor/stb/src/build_stb.sh
          bash /home/runner/odin/vendor/cgltf/src/build_cgltf.sh
          bash /home/runner/odin/vendor/box2d/build_box2d.sh
          # build.sh also builds wasm, which may fail on the runner; only the native lib is needed
          bash /home/runner/odin/vendor/box3d/src/build.sh || test -f /home/runner/odin/vendor/box3d/lib/linux-amd64/libbox3d.a

      - name: Setup Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build documentation
        run: make doc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
