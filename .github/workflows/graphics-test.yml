name: Graphics Test

on:
  workflow_dispatch:

jobs:
  software-render:
    runs-on: ubuntu-24.04
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Odin vendor libraries
        run: |
          bash /home/runner/odin/vendor/stb/src/build_stb.sh
          bash /home/runner/odin/vendor/cgltf/src/build_cgltf.sh
          bash /home/runner/odin/vendor/box2d/build_box2d.sh
          # build.sh also attempts a wasm build, which needs clang + wasm-ld and
          # may be missing on the runner. The native lib is produced first, so
          # only fail if it is actually absent.
          bash /home/runner/odin/vendor/box3d/src/build.sh || test -f /home/runner/odin/vendor/box3d/lib/linux-amd64/libbox3d.a

      # render imports both backends, so vendor:wgpu is compiled even for the vulkan build
      - name: Get wgpu-native
        run: |
          curl -fsSL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip
          unzip -q wgpu.zip -d /home/runner/odin/vendor/wgpu/lib/wgpu-linux-x86_64-release
          rm wgpu.zip

      - name: Setup Vulkan SDK (screenshot + validation layers)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.321.1
          cache: true

      - name: Install runtime dependencies
        run: |
          # lavapipe needs Mesa >= 25.3 for VK_KHR_unified_image_layouts
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libglfw3 \
            mesa-vulkan-drivers \
            vulkan-tools \
            build-essential \
            pkg-config \
            libpng-dev \
            libharfbuzz0b \
            gdb
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libglfw.so.3 /usr/lib/x86_64-linux-gnu/libglfw.so

      - name: Install ImageMagick 7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R ImageMagick/ImageMagick --pattern '*-gcc-x86_64.AppImage' -O magick.AppImage
          chmod +x magick.AppImage
          ./magick.AppImage --appimage-extract >/dev/null
          sudo mv squashfs-root /opt/imagemagick
          sudo ln -sf /opt/imagemagick/AppRun /usr/local/bin/magick
          magick --version | head -1

      - name: Verify lavapipe is selected
        run: |
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib:${LD_LIBRARY_PATH:-}"
          vulkaninfo --summary 2>&1 | grep -E "deviceName|apiVersion|driverVersion" | head -10

      - name: Build shaders
        run: make shader

      - name: Run graphics tests
        env:
          VK_LAYER_PATH: ${{ env.VULKAN_SDK }}/share/vulkan/explicit_layer.d:${{ env.VULKAN_SDK }}/etc/vulkan/explicit_layer.d
        run: |
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib:${LD_LIBRARY_PATH:-}"
          make examples

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-test-artifacts
          path: |
            artifacts
            artifacts-parallel
            game_output.log
