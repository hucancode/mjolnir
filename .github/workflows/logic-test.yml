name: Logic Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-logic-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Odin
      uses: laytan/setup-odin@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Odin vendor libraries
      run: |
        bash /home/runner/odin/vendor/stb/src/build_stb.sh
        bash /home/runner/odin/vendor/cgltf/src/build_cgltf.sh
        bash /home/runner/odin/vendor/box2d/build_box2d.sh
        bash /home/runner/odin/vendor/miniaudio/src/build_miniaudio.sh
        # build.sh also attempts a wasm build, which needs clang + wasm-ld and
        # may be missing on the runner. The native lib is produced first, so
        # only fail if it is actually absent.
        bash /home/runner/odin/vendor/box3d/src/build.sh || test -f /home/runner/odin/vendor/box3d/lib/linux-amd64/libbox3d.a

    # vendor:wgpu's BlendOperation lacks the header's Undefined = 0, so .Max reaches wgpu-native as
    # Min (black BlendMode.MAX draws); the patch also fixes the web enum table in wgpu.js
    - name: Patch vendor:wgpu BlendOperation
      run: patch -p1 -d /home/runner/odin/vendor/wgpu < "$GITHUB_WORKSPACE/.github/workflows/wgpu-blend-operation.patch"

    # render imports both backends, so vendor:wgpu is compiled even for the vulkan build
    - name: Get wgpu-native
      run: |
        curl -fsSL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip
        unzip -q wgpu.zip -d /home/runner/odin/vendor/wgpu/lib/wgpu-linux-x86_64-release
        rm wgpu.zip

    - name: Setup Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.309.0
        cache: true

    - name: Setup Slang
      run: |
        curl -fsSL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
        mkdir -p "$HOME/slang"
        tar -xzf slang.tar.gz -C "$HOME/slang"
        rm slang.tar.gz
        echo "$HOME/slang/bin" >> "$GITHUB_PATH"

    - name: Verify installations
      run: |
        odin version
        slangc -version
        make -v

    - name: Check Odin code
      run: make shader && odin check . && odin check . -define:RENDER_BACKEND=wgpu

    - name: Run tests
      run: odin test . --all-packages
