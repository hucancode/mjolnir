<header>
  <figure>
    <canvas id="storm" aria-label="Interactive lightning storm: click to strike, drag to look around" role="img"></canvas>
    <button type="button" aria-label="Toggle controls" aria-expanded="false">«</button>
    <aside hidden>
      <h3>Storm</h3>
      <div><label for="storm-rate">Strike rate</label><input id="storm-rate" data-key="rate" type="range" min="0" max="4" step="0.05"></div>
      <h3>Bolt</h3>
      <div><label for="storm-branching">Branching</label><input id="storm-branching" data-key="branching" type="range" min="0" max="1" step="0.01"></div>
      <div><label for="storm-jag">Jaggedness</label><input id="storm-jag" data-key="jag" type="range" min="0.1" max="1" step="0.01"></div>
      <div><label for="storm-thickness">Thickness</label><input id="storm-thickness" data-key="thickness" type="range" min="0.4" max="3" step="0.05"></div>
      <div><label for="storm-restrikes">Re-strikes</label><input id="storm-restrikes" data-key="restrikes" type="range" min="0" max="4" step="1"></div>
      <h3>Glow</h3>
      <div><label for="storm-bloom">Bloom</label><input id="storm-bloom" data-key="bloom" type="range" min="0" max="5" step="0.05"></div>
      <div><label for="storm-flash">Flash</label><input id="storm-flash" data-key="flash" type="range" min="0" max="5" step="0.05"></div>
      <h3>Camera</h3>
      <div class="check"><label for="storm-orbit">Auto rotate</label><input id="storm-orbit" data-key="orbit" type="checkbox"></div>

    <h1>Mjolnir Engine</h1>

<script src="hero.js" defer></script>
<script>
  const vids = [...document.querySelectorAll("main > ul video")];
  const bars = vids.map((v) => v.nextElementSibling);
  vids.forEach((v, i) => v.addEventListener("timeupdate", () => { bars[i].value = v.currentTime / (v.duration || 1); }));
  const rest = (v) => { if (v.duration && Math.abs(v.currentTime - v.duration * 0.4) > 0.05) v.currentTime = v.duration * 0.4; };
  vids.forEach((v) => { v.addEventListener("loadedmetadata", () => rest(v)); rest(v); });
  let cur = 0, hover = null, visible = false, started = false;
  const active = () => hover ?? cur;
  function sync() {
    vids.forEach((v, i) => {
      const on = visible && i === active();
      v.loop = i === hover;
      bars[i].hidden = !on;
      if (on && i === cur && !started) { started = true; v.currentTime = 0; }
      if (on) v.play().catch(() => {});
      else { v.pause(); if (i !== cur && i !== hover) rest(v); }
    });
  }
  vids.forEach((v, i) => {
    v.addEventListener("ended", () => { cur = (i + 1) % vids.length; vids[cur].currentTime = 0; sync(); });
    const li = v.closest("li");
    li.addEventListener("mouseenter", () => { hover = i; sync(); });
    li.addEventListener("mouseleave", () => { hover = null; sync(); });
  });
  new IntersectionObserver((es) => { visible = es.some((e) => e.isIntersecting); sync(); })
    .observe(document.querySelector("main > ul"));
</script>
