<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples - Mjolnir</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FV5C3T8B5Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FV5C3T8B5Y');

<body>
<nav>
  <a href="index.html">Home</a>
  <a href="examples.html">Examples</a>
  <a href="api.html">API</a>
  <a id="repo" href="https://github.com/hucancode/mjolnir">GitHub</a>
</nav>
<main>
<div>
  <search>
    <button type="button"></button>
    <nav></nav>
  </search>
  <section>
    <div>
      <div class="stage"></div>
      <div class="loader" hidden><span class="spinner"></span><span>Loading…</span></div>
      <div class="help-panel" hidden>
        <p></p>
        <p><button type="button"></button><button type="button">Code</button><button type="button">Log</button></p>
      </div>
      <button type="button" id="help" title="About this example">?</button>
    </div>
    <dialog>
      <header><strong></strong><button type="button">Close</button></header>
      <pre><code></code></pre>
    </dialog>
    <dialog>
      <header><strong>Log</strong><button type="button">Close</button></header>
      <pre></pre>
    </dialog>
  </section>
</div>
</main>
<script type="module">
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};

const data = await (await fetch("data/examples.json")).json();
const list = data.examples;
document.querySelector('#repo').href = data.url;
const hasGpu = !!navigator.gpu;
const $ = (s) => document.querySelector(s);
const nav = $('search nav'), thumbBtn = $('search button');
const stage = $('.stage'), loader = $('.loader'), loaderText = $('.loader span:last-child'), panel = $('.help-panel');
const desc = $('.help-panel p'), [modeBtn, codeBtn, logBtn] = panel.querySelectorAll('button');
const helpBtn = $('#help');
const [dialog, logDialog] = document.querySelectorAll('dialog');
const code = dialog.querySelector('code'), pre = dialog.querySelector('pre'), dialogTitle = dialog.querySelector('strong');
const closeBtn = dialog.querySelector('button');
const logPre = logDialog.querySelector('pre'), logCloseBtn = logDialog.querySelector('button');

// picker: section headers, optional poster thumbnails
let thumbs = true;
const setThumbs = () => {
  nav.classList.toggle('thumbs', thumbs);
  thumbBtn.textContent = thumbs ? 'Hide thumbnails' : 'Show thumbnails';
};
thumbBtn.addEventListener('click', () => { thumbs = !thumbs; setThumbs(); });
let category;
for (const e of list) {
  if (e.category !== category) {
    category = e.category;
    nav.append(el('h2', { textContent: category }));
  }
  const link = el('a', { href: '#' + e.name }, el('span', { textContent: e.name }));
  if (e.video) {
    // lazy images are only fetched once shown, so hidden thumbnails cost nothing
    link.prepend(el('img', { src: `posters/${e.name}.jpg`, alt: '', loading: 'lazy' }));
  } else {
    link.prepend(el('div', { className: 'no-thumb' }));
  }
  nav.append(link);
}
setThumbs();

helpBtn.addEventListener('click', () => { panel.hidden = !panel.hidden; });
codeBtn.addEventListener('click', () => { panel.hidden = true; dialog.showModal(); });
logBtn.addEventListener('click', () => { panel.hidden = true; });

let current, live; // live: whether the current example runs as a WebGPU build rather than a video

function mount() {
  const e = current;
  modeBtn.hidden = !(e.wasm && e.video && hasGpu);
  logBtn.hidden = !live;
  loader.hidden = false;
  loaderText.textContent = 'Loading…';
  const ready = () => { if (current === e) loader.hidden = true; };
  modeBtn.textContent = live ? 'Video' : 'Run live';
  if (live) {
    const f = el('iframe', { src: `data/index.html?example=${encodeURIComponent(e.name)}`, title: e.name, allow: 'fullscreen; gamepad' });
    stage.replaceChildren(f); // the loader goes on its 'ready' message (see below)
  } else if (e.video) {
    const v = el('video', { src: `videos/${e.name}.mp4`, poster: `posters/${e.name}.jpg`, autoplay: true, muted: true, loop: true, playsInline: true, controls: true });
    v.addEventListener('loadeddata', ready);
    v.muted = true; // the muted attribute must be set for autoplay to be allowed
    stage.replaceChildren(v);
  } else {
    stage.replaceChildren(el('p', { textContent: 'No live build or video for this example yet.' }));
    ready();
  }
}

// a live example's page reports its download, then its first frame or a failure
const MB = (n) => (n / 1e6).toFixed(1);
window.addEventListener('message', (ev) => {
  const m = ev.data;
  if (m?.type !== 'mjolnir' || ev.source !== stage.querySelector('iframe')?.contentWindow) return;
  if (m.state === 'progress') {
    loaderText.textContent = `Loading… ${MB(m.loaded)} MB`;
  } else if (m.state === 'ready') {
    loader.hidden = true;
  } else if (m.state === 'error') {
    loader.hidden = true;
    logBtn.click();
  }
});

function show() {
  const name = decodeURIComponent(location.hash.slice(1));
  const e = list.find((x) => x.name === name) ?? list[0];
  if (e === current) return;
  current = e;
  // fall back to the video without WebGPU or a wasm build; a build without a video may need no GPU
  live = e.wasm && (hasGpu || !e.video);
  document.title = e.name + ' - Examples - ' + data.project;
  for (const a of nav.querySelectorAll('a')) a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + e.name);
  nav.querySelector('a[aria-current]')?.scrollIntoView({ block: 'nearest' });
  panel.hidden = true;
  desc.textContent = e.desc;
  code.textContent = e.source;
  dialogTitle.textContent = e.name + ' source';
  pre.scrollTop = 0;
  mount();
}

modeBtn.addEventListener('click', () => { live = !live; mount(); });
closeBtn.addEventListener('click', () => dialog.close());
dialog.addEventListener('click', (ev) => { if (ev.target === dialog) dialog.close(); }); // backdrop click
// logs live in the (same-origin) iframe's #console; mirror them while the dialog is open
let logObserver;
logBtn.addEventListener('click', () => {
  const src = stage.querySelector('iframe')?.contentDocument?.getElementById('console');
  const sync = () => { logPre.textContent = src ? src.textContent : 'No logs available.'; logPre.scrollTop = logPre.scrollHeight; };
  sync();
  if (src) {
    logObserver = new MutationObserver(sync);
    logObserver.observe(src, { childList: true, characterData: true, subtree: true });
  }
  logDialog.showModal();
});
logDialog.addEventListener('close', () => logObserver?.disconnect());
logCloseBtn.addEventListener('click', () => logDialog.close());
logDialog.addEventListener('click', (ev) => { if (ev.target === logDialog) logDialog.close(); });
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
