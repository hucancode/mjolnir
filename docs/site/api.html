<main>
<div>
  <search>
    <input type="search" placeholder="Filter symbols…">
    <nav></nav>
  </search>
  <article></article>
</div>
</main>
<script type="module">
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};

const pkgs = await (await fetch("data/api.json")).json();
const nav = document.querySelector('search nav');
const search = document.querySelector('search input');
const content = document.querySelector('article');

const short = (path) => path.replace(/^mjolnir\/?/, '') || 'mjolnir';
const link = (p) => el('a', { href: '#' + p.path, textContent: short(p.path) });

// layers top (glue) to bottom (core), each with its packages
const layers = [];
for (const p of pkgs) (layers[p.layer] ??= { n: p.layer, name: p.layer_name, pkgs: [] }).pkgs.push(p);
layers.reverse();
for (const l of layers) nav.append(el('h2', { textContent: l.name.toUpperCase() }), ...l.pkgs.map(link));

// comments are hard-wrapped: join prose lines into paragraphs, keep indented lines (lists) as they are
function prose(text) {
  return text.split('\n\n').map((para) => {
    const lines = [];
    for (const line of para.split('\n')) {
      const prev = lines.length - 1;
      if (prev >= 0 && !/^\s/.test(line) && !/^\s/.test(lines[prev])) lines[prev] += ' ' + line;
      else lines.push(line);
    }
    return el('p', { className: 'doc', textContent: lines.join('\n') });
  });
}

// the layers as rows of packages; marks a package, what it imports and what imports it
function diagram(current) {
  const chips = new Map();
  const fig = el('figure', { className: 'layers' });
  for (const l of layers) {
    const row = el('div', {}, el('small', { textContent: l.name.toUpperCase() }));
    for (const p of l.pkgs) {
      const a = link(p);
      a.addEventListener('mouseenter', () => mark(p));
      chips.set(p.path, a);
      row.append(a);
    }
    fig.append(row);
  }
  function mark(pkg) {
    for (const [path, a] of chips) {
      a.toggleAttribute('aria-current', path === pkg.path);
      a.classList.toggle('dep', pkg.imports.includes(path));
      a.classList.toggle('user', pkgs.find((p) => p.path === path).imports.includes(pkg.path));
    }
  }
  fig.addEventListener('mouseleave', () => mark(current));
  mark(current);
  return fig;
}

function show() {
  const path = decodeURIComponent(location.hash.slice(1)) || pkgs[0].path;
  const pkg = pkgs.find((p) => p.path === path) ?? pkgs[0];
  document.title = pkg.path + ' - Mjolnir';
  for (const a of nav.querySelectorAll('a')) a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + pkg.path);
  content.replaceChildren(el('h1', { textContent: pkg.path }), el('small', { textContent: `LAYER ${pkg.layer}: ${pkg.layer_name.toUpperCase()}` }));
  if (pkg.doc) content.append(...prose(pkg.doc));
  content.append(diagram(pkg));
  if (pkg.notes) content.append(el('h2', { textContent: 'Architecture' }), ...prose(pkg.notes));
  if (pkg.sections.length) content.append(el('h2', { textContent: 'API' }));
  for (const s of pkg.sections) {
    content.append(el('h3', { textContent: s.name }));
    const dl = el('dl');
    for (const sym of s.syms) {
      const d = el('div', {}, el('dt', {}, el('code', { textContent: sym.sig })));
      if (sym.doc) d.append(el('dd', { textContent: sym.doc }));
      dl.append(d);
    }
    content.append(dl);
  }
  filter();
}

function filter() {
  const q = search.value.trim().toLowerCase();
  for (const d of content.querySelectorAll('dl > div')) d.hidden = !!q && !d.textContent.toLowerCase().includes(q);
}

search.addEventListener('input', filter);
addEventListener('hashchange', show);
show();
</script>
</body>
